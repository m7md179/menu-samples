<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>شاورما وبروستد هيا · قائمة رقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#a8551b;--bg:#f7f3ee;--card:#fff;--ink:#1f1b17;--mute:#857b70;--line:#efe7dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
.demo{background:#1f1b17;color:#efe8de;font-size:12.5px;padding:7px 16px;text-align:center}
.cover{position:relative;color:#fff;padding:28px 16px 64px;text-align:center;overflow:hidden;
 background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.18) 0 2px,transparent 3px) 0 0/26px 26px,
 linear-gradient(160deg,var(--a),color-mix(in srgb,var(--a) 60%,#000))}
.lang{position:absolute;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px}
.logo{width:76px;height:76px;margin:6px auto 12px;border-radius:22px;background:#fff;color:var(--a);display:grid;place-items:center;font-size:36px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cover h1{margin:0;font-size:26px;font-weight:700}
.cover .sub{opacity:.9;font-size:14px;margin-top:4px}
.open{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:999px;font-size:13px}
.open i{width:8px;height:8px;border-radius:50%;background:#5ef08a;display:inline-block}
.wrap{max-width:560px;margin:-40px auto 0;padding:0 14px 120px;position:relative}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
.actions a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);font-size:12.5px;padding:6px 0;border-radius:12px}
.actions a span{font-size:20px}
.search{margin:14px 0 4px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 40px 12px 14px;font:inherit;outline:none}
.search input:focus{border-color:var(--a)}
.search b{position:absolute;top:11px;inset-inline-start:14px;opacity:.5}
[dir=ltr] .search input{padding:12px 14px 12px 40px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 2px;background:var(--bg);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;font-size:14px}
nav button.on{background:var(--a);border-color:var(--a);color:#fff}
h2{font-size:18px;margin:18px 4px 8px;color:var(--a)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.item .t{flex:1;min-width:0}
.item .n{font-weight:600}
.item .d{color:var(--mute);font-size:13px;margin-top:1px}
.item .p{font-weight:700;margin-top:4px}
.item .p small{font-weight:400;color:var(--mute);font-size:12px}
.hot{display:inline-block;font-size:11px;font-weight:600;color:var(--a);background:color-mix(in srgb,var(--a) 12%,#fff);border-radius:6px;padding:1px 7px;margin-inline-start:6px;vertical-align:2px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:11px;border:0;background:color-mix(in srgb,var(--a) 12%,#fff);color:var(--a);font-size:20px;line-height:1}
.qty button.add{background:var(--a);color:#fff}
.qty span{min-width:14px;text-align:center;font-weight:700}
.empty{text-align:center;color:var(--mute);padding:30px 0;display:none}
.qr{margin-top:22px;background:var(--card);border-radius:18px;padding:18px;text-align:center;color:var(--mute);font-size:13.5px}
.qr img{width:132px;height:132px;display:block;margin:0 auto 8px}
footer{text-align:center;color:var(--mute);font-size:12.5px;margin-top:18px}
footer a{color:var(--a);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));transform:translateY(120%);transition:transform .25s}
.bar.show{transform:none}
.bar a{max-width:532px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:#1fae57;color:#fff;text-decoration:none;font-weight:700;padding:14px 18px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="demo" data-t="demo"></div>
<header class="cover">
 <button class="lang" id="lang">EN</button>
 <div class="logo">🌯</div>
 <h1 id="name"></h1>
 <div class="sub" id="area"></div>
 <div class="open"><i></i><span data-t="open"></span></div>
</header>
<div class="wrap">
 <div class="actions">
  <a href="tel:+962795366712"><span>📞</span><b data-t="call"></b></a>
  <a href="https://www.google.com/maps/search/?api=1&amp;query=31.9199887,35.9222965" target="_blank" rel="noopener"><span>📍</span><b data-t="map"></b></a>
  <a href="https://wa.me/962795366712" target="_blank" rel="noopener"><span>💬</span><b data-t="wa"></b></a>
 </div>
 <div class="search"><b>🔍</b><input id="q" type="search" autocomplete="off"></div>
 <nav id="nav"></nav>
 <main id="menu"></main>
 <div class="empty" id="empty" data-t="none"></div>
 <div class="qr"><img src="qr.png" alt="QR"><span data-t="qr"></span></div>
 <footer><span data-t="by"></span> <a href="https://tahamedia.online">Taha Media</a></footer>
</div>
<div class="bar" id="bar"><a id="order" target="_blank" rel="noopener"><span id="ordtxt"></span><span id="ordsum"></span></a></div>
<script>
const D={"name": {"ar": "شاورما وبروستد هيا", "en": "شاورما وبروستد هيا"}, "area": {"ar": "عمّان", "en": "Amman, Jordan"}, "phone": "962795366712", "sections": [{"ar": "شاورما", "en": "Shawarma", "items": [{"ar": "شاورما دجاج", "en": "Chicken Shawarma", "d_ar": "ثوم، مخلل، بطاطا", "d_en": "Garlic, pickles, fries", "price": "1.25", "hot": true}, {"ar": "شاورما لحمة", "en": "Beef Shawarma", "d_ar": "طحينة وبصل وبقدونس", "d_en": "Tahini, onion, parsley", "price": "1.75", "hot": false}, {"ar": "وجبة عربي", "en": "Arabi Meal", "d_ar": "شاورما مقطعة مع بطاطا وثومية", "d_en": "Cut shawarma, fries, garlic dip", "price": "3.50", "hot": true}]}, {"ar": "بروستد", "en": "Broasted", "items": [{"ar": "بروستد 4 قطع", "en": "Broasted 4 pcs", "d_ar": "مع بطاطا وثومية", "d_en": "With fries and garlic dip", "price": "4.25", "hot": false}, {"ar": "زنجر", "en": "Zinger", "d_ar": "", "d_en": "", "price": "3.75", "hot": false}]}, {"ar": "مشروبات", "en": "Drinks", "items": [{"ar": "مشروب غازي", "en": "Soft Drink", "d_ar": "", "d_en": "", "price": "0.60", "hot": false}, {"ar": "عصير برتقال", "en": "Orange Juice", "d_ar": "", "d_en": "", "price": "1.50", "hot": false}]}]};
const T={ar:{demo:"نموذج تجريبي مجاني أُعدّ لـ "+D.name.ar+" · الأصناف والأسعار للتوضيح فقط",open:"قائمة رقمية",call:"اتصال",map:"الموقع",wa:"واتساب",
 search:"ابحث في القائمة…",none:"لا توجد نتائج",qr:"هذا الرمز يُطبع على الطاولات ويفتح القائمة مباشرة",by:"تصميم",cur:"د.أ",hot:"الأكثر طلبًا",
 order:n=>"أرسل الطلب ("+n+")",hello:"مرحبا، بدي أطلب:",total:"المجموع"},
 en:{demo:"Free demo made for "+D.name.en+" · items and prices are examples only",open:"Digital menu",call:"Call",map:"Location",wa:"WhatsApp",
 search:"Search the menu…",none:"No matching items",qr:"Print this code on your tables — it opens the menu instantly",by:"Made by",cur:"JOD",hot:"Best seller",
 order:n=>"Send order ("+n+")",hello:"Hi, I'd like to order:",total:"Total"}};
let L="ar";const cart={};
const $=s=>document.querySelector(s);
function render(){
 const t=T[L];document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 $("#lang").textContent=L=="ar"?"EN":"عربي";$("#name").textContent=D.name[L];$("#area").textContent=D.area[L];
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);$("#q").placeholder=t.search;
 $("#nav").innerHTML=D.sections.map((s,i)=>`<button data-i="${i}">${s[L]}</button>`).join("");
 $("#menu").innerHTML=D.sections.map((s,i)=>`<section id="s${i}"><h2>${s[L]}</h2>`+s.items.map((it,j)=>{const k=i+"-"+j;return `
  <div class="item" data-k="${k}" data-s="${(it.ar+" "+it.en).toLowerCase()}"><div class="t"><div class="n">${it[L]}${it.hot?`<span class="hot">${t.hot}</span>`:""}</div>
  ${it["d_"+L]?`<div class="d">${it["d_"+L]}</div>`:""}<div class="p">${it.price} <small>${t.cur}</small></div></div>
  <div class="qty">${cart[k]?`<button data-k="${k}" data-d="-1">−</button><span>${cart[k]}</span>`:""}<button class="add" data-k="${k}" data-d="1">+</button></div></div>`}).join("")+"</section>").join("");
 filter();bar();spy();
}
function filter(){const q=$("#q").value.trim().toLowerCase();let any=0;
 document.querySelectorAll("section").forEach(s=>{let n=0;s.querySelectorAll(".item").forEach(e=>{const ok=!q||e.dataset.s.includes(q);e.style.display=ok?"":"none";n+=ok});s.style.display=n?"":"none";any+=n});
 $("#empty").style.display=any?"none":"block";}
function bar(){const t=T[L];let n=0,sum=0,lines=[];
 for(const k in cart){const[i,j]=k.split("-");const it=D.sections[i].items[j];n+=cart[k];sum+=cart[k]*it.price;lines.push(cart[k]+" × "+it[L])}
 $("#bar").classList.toggle("show",n>0);$("#ordtxt").textContent=t.order(n);$("#ordsum").textContent=sum.toFixed(2)+" "+t.cur;
 $("#order").href="https://wa.me/"+D.phone+"?text="+encodeURIComponent(t.hello+"\n"+lines.join("\n")+"\n"+t.total+": "+sum.toFixed(2)+" "+t.cur);}
function spy(){const b=[...document.querySelectorAll("nav button")];let cur=0;
 document.querySelectorAll("section").forEach((s,i)=>{if(s.getBoundingClientRect().top<120)cur=i});b.forEach((x,i)=>x.classList.toggle("on",i==cur));}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id=="lang"){L=L=="ar"?"en":"ar";render()}
 else if(b.dataset.i!=null)document.getElementById("s"+b.dataset.i).scrollIntoView({behavior:"smooth"});
 else if(b.dataset.k){const k=b.dataset.k;cart[k]=Math.max(0,(cart[k]||0)+ +b.dataset.d);if(!cart[k])delete cart[k];render()}});
$("#q").addEventListener("input",filter);addEventListener("scroll",spy,{passive:true});
render();
</script>
</body>
</html>
